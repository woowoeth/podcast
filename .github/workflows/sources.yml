name: source health

on:
  schedule:
    - cron: "20 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # 推送后给 ci.yml 派单（scripts/bot-push.sh ci）

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet certifi truststore
      - run: python -m pip install --quiet "opencc==1.4.2"
      - name: Probe every feed, re-resolve the ones that moved
        run: python pipeline/resolve_sources.py --check 2>&1 | tee "${RUNNER_TEMP}/sources.log"
      - name: Commit if anything changed
        run: |
          git config user.name  "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          # usage.json 逐日累加的三方合并。驱动按检出配置、不跟仓库走，每个会合并的地方都得自己登记。
          git config merge.usage.driver 'python pipeline/merge_usage.py %O %A %B'
          git add data/sources.json
          git diff --cached --quiet && { echo "all feeds unchanged"; exit 0; }
          git commit -m "sources: refresh feed health"
          python pipeline/build.py && git add -A || true
          git commit --amend --no-edit || true
          git pull --rebase --autostash origin main && bash scripts/bot-push.sh git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sources-log, path: "${{ runner.temp }}/sources.log", retention-days: 30 }

      # 用 GITHUB_TOKEN 推的提交不触发 ci.yml（POSTMORTEM 34）。这一轮推过，就给它派一次单，
      # 查推上去的最后一个提交；派不出去就红。见 scripts/bot-push.sh。
      - name: 这一轮推上去的提交也过 CI
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/bot-push.sh ci
