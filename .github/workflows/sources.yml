name: source health

on:
  schedule:
    - cron: "20 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet certifi truststore
      - name: Restore full build.py + always show all category chips
        run: |
          git checkout 388f8e54ab051883ad4fd40e9f59c3c69f60fe41 -- pipeline/build.py
          python3 - <<'PY'
          from pathlib import Path
          t = Path("pipeline/build.py").read_text()
          old = (
              "    for c in CAT_ORDER:\n"
              "        if counts.get(c):\n"
              "            chips.append(f'<button class=\"chip\" data-cat-chip=\"{c}\" aria-pressed=\"false\">'\n"
              "                         f'{CAT_LABEL[c]}<span class=\"n\">{counts[c]}</span></button>')"
          )
          new = (
              "    for c in CAT_ORDER:\n"
              "        chips.append(f'<button class=\"chip\" data-cat-chip=\"{c}\" aria-pressed=\"false\">'\n"
              "                     f'{CAT_LABEL[c]}<span class=\"n\">{counts.get(c, 0)}</span></button>')"
          )
          if old not in t:
              # already patched or different format — keep restored file as-is
              print("chip pattern not found (may already be patched); keeping restored build.py")
          else:
              Path("pipeline/build.py").write_text(t.replace(old, new, 1))
              print("patched chips")
          PY
          python pipeline/build.py
          git config user.name  "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add pipeline/build.py index.html sources/index.html log/index.html feed.xml sitemap.xml search.json llms.txt llms-full.txt robots.txt || true
          git add -A || true
          if ! git diff --cached --quiet; then
            git commit -m "fix build.py; show all homepage category chips"
            git pull --rebase --autostash origin main || true
            git push
          fi
      - name: Probe every feed, re-resolve the ones that moved
        run: python pipeline/resolve_sources.py --check 2>&1 | tee "${RUNNER_TEMP}/sources.log"
      - name: Commit if anything changed
        run: |
          git config user.name  "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add data/sources.json
          git diff --cached --quiet && { echo "all feeds unchanged"; exit 0; }
          git commit -m "sources: refresh feed health"
          python pipeline/build.py && git add -A || true
          git commit --amend --no-edit || true
          git pull --rebase --autostash origin main && git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sources-log, path: "${{ runner.temp }}/sources.log", retention-days: 30 }
