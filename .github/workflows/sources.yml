name: source health

on:
  schedule:
    - cron: "20 3 * * 1"          # 每周一，北京时间约 11:20
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet certifi truststore
      - name: Probe every feed, re-resolve the ones that moved
        run: python pipeline/resolve_sources.py --check 2>&1 | tee "${RUNNER_TEMP}/sources.log"
      - name: Commit if anything changed
        run: |
          git config user.name  "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add data/sources.json
          git diff --cached --quiet && { echo "all feeds unchanged"; exit 0; }
          git commit -m "sources: refresh feed health"
          python pipeline/build.py && git add -A sources/index.html || true
          git commit --amend --no-edit
          git pull --rebase --autostash origin main && git push
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sources-log, path: "${{ runner.temp }}/sources.log", retention-days: 30 }
