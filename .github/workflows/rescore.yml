name: rescore

# 给已发布的稿子补成稿评分，不到 8 分的下站。
# 云端限定 feed,notes,page 三层取稿——youtube 层在机房 IP 上取不到，
# 那几篇会被标为"跳过"而不是误判成不合格。
on:
  workflow_dispatch:
    inputs:
      min:
        description: "及格线 0-10"
        default: "7"
      dry_run:
        description: "true = 只看分数不动文件"
        default: "false"

permissions:
  contents: write
concurrency:
  group: podcast-write
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet certifi truststore
      - run: python -m pip install --quiet "opencc==1.4.2"
      - name: Rescore
        env:
          LLM_PROVIDER: anthropic            # 只走 Claude（2026-09-25 停用 DeepSeek）
          LLM_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL:    claude-opus-5        # 贵模型：首稿过不了成稿评分时重写
          LLM_MODEL_TRIAGE: claude-sonnet-5  # 初筛、分段抽取、深读首稿
          LLM_MODEL_REVIEW: claude-opus-5    # 成稿评分：和首稿（sonnet）不用同一个模型 —— 自己给自己打分会偏袒
        run: |
          set -o pipefail
          DRY=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY="--dry-run"
          python pipeline/rescore.py --min "${{ github.event.inputs.min || '7' }}" \
            --tiers feed,notes,page $DRY 2>&1 | tee "${RUNNER_TEMP}/rescore.log"
      - name: Commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          # usage.json 逐日累加的三方合并。驱动按检出配置、不跟仓库走，每个会合并的地方都得自己登记。
          git config merge.usage.driver 'python pipeline/merge_usage.py %O %A %B'
          git add -A data
          git diff --cached --quiet && { echo "没有变化"; exit 0; }
          git commit -m "rescore: 成稿评分不足的下站"
          python pipeline/build.py
          git add -A
          git diff --cached --quiet || git commit -m "build: regenerate site"
          for i in $(seq 1 8); do
            git push && exit 0
            git pull --rebase --autostash origin main || true
            python pipeline/build.py; git add -A
            git commit --amend --no-edit || true
            sleep $(( (RANDOM % 5) + 3 ))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: rescore-log, path: "${{ runner.temp }}/rescore.log", retention-days: 30 }
