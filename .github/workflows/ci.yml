name: ci

# 这个 workflow 本该一开始就有。仓库里 140 多项守护检查，在它之前**从来没在 CI 里
# 跑过**——只在我记得跑的时候跑。于是接连出了几次"改完直接推、推完才发现"的事故：
# 提交了指向仓库自身的符号链接（Pages 打包无限递归）、心跳 heredoc 静默失效、
# 本机脚本的产物清单漏了两个目录、推送重试用 reset --soft 把源码回退。
# 每一个都能被这里的某一项挡住。
#
# 也包括 bot 的提交：bot 有权限写 main，那它就必须过同一道闸门。
# 人和本机线的推送走下面的 push 触发。**云端 bot 的推送不走它**：用 GITHUB_TOKEN 推上去的
# 提交不启动别的工作流（GitHub 的规则）—— 2026-09-28 curate 推出去半套站，这里「产物和
# 仓库一致」那一步本来能抓住，可它根本没跑（POSTMORTEM 34）。所以 bot 的推送都经过
# scripts/bot-push.sh，job 最后一步用 workflow_dispatch 给这里派一次单（GITHUB_TOKEN 发起的
# 事件里只有它和 repository_dispatch 会起新 run），查**这一轮推上去的最后一个提交**，
# run 名字里写着 SHA 和是哪一轮派的。只查最后一个：日更先推只有数据的提交、再推重建的站，
# 中间那个的产物本来就是旧的。
# 守护 BotPushesGetTheSameCI 核每条会推送的工作流都这么接了。
run-name: ${{ inputs.sha && format('bot 推送 {0}（{1}）', inputs.sha, inputs.from) || '' }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "要查的提交（完整 40 位；bot 推送后自动派）。留空 = 所选分支的最新提交"
        default: ""
      from:
        description: "谁派的（bot 工作流名 #run id）"
        default: ""

permissions:
  contents: read

concurrency:
  # 同一个分支上连着推几次，只验最后一次。bot 派来的单按 SHA 各占一组：它们查的是
  # 各自那一轮留给 main 的样子，不能被紧跟着的一次人手推送（或别的 bot）取消掉。
  group: ci-${{ github.ref }}-${{ inputs.sha || 'tip' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # bot 派来的单查它推上去的那个提交，不是派单那一刻分支的最新（中间可能又有人推了）。
          # 留空时（push / PR / 手动不填）照旧取触发它的那个提交。
          ref: ${{ inputs.sha }}

      - name: 查的正是要查的那个提交
        if: ${{ inputs.sha != '' }}
        env:
          WANT: ${{ inputs.sha }}
        run: |
          got=$(git rev-parse HEAD)
          [ "$got" = "$WANT" ] || { echo "::error::要查 ${WANT}，检出的却是 $got"; exit 1; }
          # 按 SHA 检出没有 origin/<分支> 这个引用，push 触发的检出有（指着同一个提交）。
          # 体检里「跑的是不是 origin/main 最新版」要读它 —— 补上，两种触发看到的仓库才一样。
          git update-ref "refs/remotes/origin/${GITHUB_REF_NAME}" HEAD
          echo "查的是 ${got}（${GITHUB_REF_NAME}）"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 守护检查与单元测试
        run: |
          # **必须有 pipefail。** 下面是 `... | tail -40`，没有它退出码取的是
          # tail 的——永远 0。这条 CI 是这个仓库的安全网，而它在这一行上
          # **一直是失败时放行的**：测试红了照样报 success，实测有一条渲染层
          # 检查在 CI 里失败了好几轮，没有任何人知道。
          set -o pipefail
          python -m pip install --quiet pyyaml
          python -m pip install --quiet "opencc==1.4.2"
          # 渲染层体检要真的开浏览器。这一层是补上来的：用户一轮报的 11 个问题
          # 里 10 个在渲染层，而当时 300 多项守护没有一项打开过真实页面。
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          # 本机转写的切片测试要真的 ffmpeg（造一段带大元数据的音频来切）；没装的话那条在 CI 上直接失败
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          python -m unittest discover -s tests -v 2>&1 | tail -40

      # 下面每一项都带 `if: !cancelled()`：**各查各的，前面红了也照跑。** 没有它，单元测试一红，
      # 后面全是 skipped —— 2026-09-26 到 09-29 那几天 main 上的 CI 一直红在单元测试，
      # 「生成产物和仓库里的一致」一次都没跑过；09-28 curate 那次就算 CI 跑了也抓不住。

      # **依赖缺失时 unittest 会静默 skip**，而上面是 `| tail -40`——
      # "跳过了整层浏览器检查"和"全过"在输出上分不出来。这两层是唯一
      # 会打开真实页面的检查，静默消失等于没有。
      - name: 浏览器那两层必须真的跑了
        if: ${{ !cancelled() }}
        run: python scripts/require-browser-layers.py

      - name: shell 语法
        if: ${{ !cancelled() }}
        run: |
          for f in scripts/*.sh; do bash -n "$f" || exit 1; done
          echo "所有脚本语法正常"

      - name: workflow YAML 可解析
        if: ${{ !cancelled() }}
        run: |
          python - <<'EOF'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.safe_load(open(f)); print("ok", f)
              except Exception as e:
                  print("::error::%s: %s" % (f, e)); bad = 1
          sys.exit(bad)
          EOF

      - name: 入库的符号链接不许指回仓库内部
        if: ${{ !cancelled() }}
        run: |
          # 这一条炸的是部署而不是代码，测试全绿也看不出来：一个指向仓库自身的
          # 符号链接会让 Pages 的 Upload artifact 无限递归，卡死整轮部署。
          bad=0
          git ls-files -s | awk '$1=="120000"{print $4}' | while read -r f; do
            target=$(cd "$(dirname "$f")" && readlink -f "$(basename "$f")" 2>/dev/null || true)
            case "$target" in
              "$GITHUB_WORKSPACE"*) echo "::error::$f -> $target 指回仓库内部"; exit 1;;
            esac
          done || bad=1
          exit $bad

      - name: 构建是幂等的
        if: ${{ !cancelled() }}
        run: |
          # 同样的数据连续构建两次必须一字不差。不成立说明生成产物里混进了时间戳
          # 或随机顺序，而那会让每一轮跑批都在生成产物上冲突。
          # 比完整 diff 的指纹，不比 --stat：时间戳这种「行数不变、内容变了」的差异 --stat 看不见，
          # api.json 里的构建时刻就这样两次都是「2 +-」、每次都放过去了。
          python pipeline/build.py >/dev/null
          git diff | shasum > /tmp/a.txt
          git status --porcelain | sort > /tmp/a2.txt
          python pipeline/build.py >/dev/null
          git diff | shasum > /tmp/b.txt
          git status --porcelain | sort > /tmp/b2.txt
          diff /tmp/a.txt /tmp/b.txt && diff /tmp/a2.txt /tmp/b2.txt \
            || { echo "::error::构建不幂等，两次结果不同"; exit 1; }
          echo "连续两次构建结果一致"

      - name: 生成产物和仓库里的一致
        if: ${{ !cancelled() }}
        run: |
          # 有人用 --no-build 发了内容却没重建，或者重建被打断——站上就会缺页。
          # 自己建一次，不靠上一步：上一步在建站之前就红了的话，这里量的会是没建过的树，永远是绿的。
          python pipeline/build.py >/dev/null
          if ! git diff --quiet; then
            echo "::error::重新构建后产物有差异：说明推上来的生成产物是旧的"
            git diff --stat
            exit 1
          fi
          echo "仓库里的生成产物是最新的"

      - name: 体检（只查文件）
        if: ${{ !cancelled() }}
        run: python pipeline/healthcheck.py
