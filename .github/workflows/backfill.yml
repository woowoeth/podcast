name: backfill

# 追赶存量：日更任务只看最近 10 天，建档要靠这个手动跑。
# 从自带官方逐字稿的信源里往回补（Odd Lots 1260 集、Latent Space 220 集、
# Dwarkesh 136 集、TBPN 649 集…），每源上限放宽，跑几轮就能把存档做厚。
on:
  workflow_dispatch:
    inputs:
      days:
        description: "回溯多少天（建档用 180 或 365）"
        default: "180"
      limit:
        description: "本次最多处理几个候选"
        default: "12"
      per_source:
        description: "单个信源最多取几集"
        default: "4"
      review_min:
        description: "成稿评分及格线 0-10（低于此分不上站）"
        default: "7"
      triage_min:
        description: "选题闸门及格线 0-10（建档从几千集里挑，建议 8）"
        default: "8"
      only:
        description: "限定信源 id，逗号分隔可给多个（留空=全部）"
        default: ""
      cat:
        description: "限定分类：ai / biz / cn（留空=全部）"
        default: ""

permissions:
  contents: write

concurrency:
  group: podcast-write          # 与日更任务同一把锁，不会互相踩
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet yt-dlp certifi truststore
          python -m pip install --quiet "opencc==1.4.2"
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
      - name: Backfill
        env:
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:    ${{ secrets.LLM_MODEL }}
          # 选题用便宜模型，评审换一家——同一个模型给自己的作业打分会偏袒
          # 长集分段抽取用便宜模型。不配就回落到 LLM_MODEL_TRIAGE，
          # 所以不需要新加 secret 也已经省下来了。
          LLM_MODEL_MAP: ${{ secrets.LLM_MODEL_MAP }}
          LLM_MODEL_TRIAGE: ${{ secrets.LLM_MODEL_TRIAGE }}
          LLM_MODEL_REVIEW: ${{ secrets.LLM_MODEL_REVIEW }}
          LLM_AUTH:     ${{ secrets.LLM_AUTH }}
          TRANSCRIBE_API_KEY:  ${{ secrets.TRANSCRIBE_API_KEY }}
          TRANSCRIBE_BASE_URL: ${{ secrets.TRANSCRIBE_BASE_URL }}
          TRANSCRIBE_MODEL:    ${{ secrets.TRANSCRIBE_MODEL }}
          JOBS: "3"
        run: |
          set -o pipefail
          ONLY=""
          if [ -n "${{ github.event.inputs.only }}" ]; then ONLY="--only ${{ github.event.inputs.only }}"; fi
          if [ -n "${{ github.event.inputs.cat }}" ]; then ONLY="$ONLY --cat ${{ github.event.inputs.cat }}"; fi
          python pipeline/run.py $ONLY --tiers feed,notes,page,asr --skip-residential --no-build \
            --days "${{ github.event.inputs.days }}" \
            --limit "${{ github.event.inputs.limit }}" \
            --per-source "${{ github.event.inputs.per_source }}" \
            --triage-min "${{ github.event.inputs.triage_min || '8' }}" \
            --review-min "${{ github.event.inputs.review_min || '7' }}" \
            2>&1 | tee "${RUNNER_TEMP}/backfill.log"
      - name: Commit and push
        run: |
          set -uo pipefail
          git config user.name  "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          # state.json 是两条线唯一会真冲突的数据文件。没有这个驱动，
          # 冲突会在工作区留下标记，之后每次 git pull --rebase 都报
          # "unmerged files"，重试循环从此全撞在同一面墙上（真出过一次）。
          git config merge.podcast-state.driver 'python pipeline/mergestate.py %O %A %B'

          # 只提交数据。data/episodes 的文件名唯一，rebase 永远不冲突；
          # 生成产物（index.html / p/ / feed.xml …）永远从合并后的数据重建，
          # 不参与合并——这才是它们不该冲突的正确做法。
          # rebase 之前清掉生成产物。run.py 发布成功后会自己 build 一次，留下未跟踪的
          # p/ 与 s/；rebase 要覆盖它们就会 "could not detach HEAD" 直接中止 —— 日更
          # 就是这么失败的。生成产物永远从合并后的数据重建，不该参与合并。
          git clean -fdq p s 2>/dev/null || true
          git checkout -q -- index.html sources feed.xml sitemap.xml robots.txt 404.html \
                            search.json llms.txt llms-full.txt 2>/dev/null || true
          git add data/episodes data/state.json data/sources.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          N=$(git diff --cached --name-only | grep -c 'data/episodes/' || true)
          git commit -m "backfill: $N new"

          ok=0
          for i in $(seq 1 10); do
            git pull --rebase --autostash origin main || {
              # state.json 是派生索引，冲突时取远端再由 reconcile 从落盘记录校准
              git checkout --theirs data/state.json 2>/dev/null || true
              git add data/state.json 2>/dev/null || true
              git -c core.editor=true rebase --continue || git rebase --abort || true
            }
            if git push; then ok=1; break; fi
            echo "push retry $i"; sleep $(( (RANDOM % 7) + 3 ))
          done
          if [ "$ok" != 1 ]; then
            echo "::error::数据推送失败 —— 本轮 $N 篇内容会随 runner 一起销毁"
            exit 1
          fi

          # 站点从合并后的全量数据重建
          python pipeline/build.py
          git add index.html sources s p feed.xml sitemap.xml robots.txt 404.html \
                  search.json llms.txt llms-full.txt icon.svg .nojekyll 2>/dev/null || true
          git diff --cached --quiet && { echo "site unchanged"; exit 0; }
          git commit -m "build: regenerate site"
          ok=0
          for i in $(seq 1 10); do
            if git push; then ok=1; break; fi
            # 生成产物冲突一律以重建为准，不做三方合并
            git fetch origin main
            # 三步都必需：--mixed 让索引对齐远端（--soft 会让下一个提交回退
            # 别人推上来的源码，真出过事）；取回远端有而本机没有的数据文件，
            # 否则 git add 会把别人刚发的内容当成删除提交上去；state.json 是索引
            # 不是真相，从磁盘重建而不是三方合并。
            git reset --mixed origin/main
            git diff --name-only --diff-filter=D -- data | while read -r f; do
              git checkout -- "$f" 2>/dev/null || true
            done
            python pipeline/run.py --reconcile || true
            python pipeline/build.py
            git add index.html sources s p feed.xml sitemap.xml robots.txt 404.html \
                    search.json llms.txt llms-full.txt icon.svg .nojekyll 2>/dev/null || true
            git diff --cached --quiet && { echo "site unchanged after rebuild"; ok=1; break; }
            git commit -m "build: regenerate site"
            echo "push retry $i"; sleep $(( (RANDOM % 7) + 3 ))
          done
          if [ "$ok" != 1 ]; then
            echo "::error::站点重建推送失败（数据已入库，下一轮会重建）"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backfill-log, path: "${{ runner.temp }}/backfill.log", retention-days: 30 }
