name: probe key

# 用仓库里存的 ANTHROPIC_API_KEY 判断它到底是哪种凭证（API key 还是 OAuth token）、能不能用。
# 只输出长度与前缀家族，绝不打印密钥片段。
on:
  workflow_dispatch:
    inputs:
      what:
        description: "探测哪个：llm 或 asr"
        default: "llm"
      auth:
        description: "强制 header 模式：留空=自动判断，api-key，bearer"
        default: ""
      base_url:
        description: "（只对 asr）临时试一个转写端点"
        default: ""
      model:
        description: "llm：试哪个 Claude 型号（留空=claude-opus-5）；asr：转写模型名"
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet certifi truststore
      - name: Probe
        env:
          LLM_PROVIDER: anthropic
          LLM_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL:    ${{ github.event.inputs.model || 'claude-opus-5' }}
          LLM_AUTH:     ${{ github.event.inputs.auth }}
          TRANSCRIBE_API_KEY:  ${{ secrets.TRANSCRIBE_API_KEY }}
          TRANSCRIBE_BASE_URL: ${{ github.event.inputs.base_url || secrets.TRANSCRIBE_BASE_URL }}
          TRANSCRIBE_MODEL:    ${{ github.event.inputs.model || secrets.TRANSCRIBE_MODEL }}
        run: |
          if [ "${{ github.event.inputs.what }}" = "asr" ]; then
            python pipeline/whoami.py --asr
          else
            python pipeline/whoami.py
          fi
