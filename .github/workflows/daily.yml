name: daily digest

on:
  schedule:
    # 早班 + 晚间加量。GitHub cron 用 UTC，会略漂移。
    # 晚间多班是为了把各分类送进闸门，不是为了刷量灌水。
    - cron: "40 0 * * *"     # 北京 08:40 早班
    - cron: "10 1 * * *"     # 早班补跑
    - cron: "30 3 * * *"     # 北京 11:30 午间
    - cron: "0 10 * * *"     # 北京 18:00 傍晚
    - cron: "40 12 * * *"    # 北京 20:40 晚班
    - cron: "40 14 * * *"    # 北京 22:40 晚班加量
    - cron: "20 16 * * *"    # 北京 00:20 夜间收尾
  workflow_dispatch:
    inputs:
      limit:
        description: "本次最多处理几集（进闸门的上限）"
        default: "12"
      days:
        description: "回溯多少天"
        default: "21"
      review_min:
        description: "成稿评分及格线 0-10（低于此分不上站）"
        default: "7"
      triage_min:
        description: "选题闸门及格线 0-10"
        default: "7"
      only:
        description: "只跑指定信源 id，逗号分隔（留空跑全部）"
        default: ""

permissions:
  contents: write

# GitHub 并发组只会保留「在跑 1 个 + 排队 1 个」，多出来的 pending 会被取消。
# 所以每轮用独立 group（run_id），互不取消。写冲突靠后面 commit 的 rebase 重试。
concurrency:
  group: digest-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --quiet --upgrade pip
          # yt-dlp is the middle transcript tier; certifi/truststore keep TLS sane.
          python -m pip install --quiet yt-dlp certifi truststore
          # ffmpeg is only needed to chunk long audio before transcription.
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg

      - name: Run the pipeline
        env:
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:    ${{ secrets.LLM_MODEL }}
          # 选题用便宜模型，评审换一家——同一个模型给自己的作业打分会偏袒
          # 长集分段抽取用便宜模型。不配就回落到 LLM_MODEL_TRIAGE，
          # 所以不需要新加 secret 也已经省下来了。
          LLM_MODEL_MAP: ${{ secrets.LLM_MODEL_MAP }}
          LLM_MODEL_TRIAGE: ${{ secrets.LLM_MODEL_TRIAGE }}
          LLM_MODEL_REVIEW: ${{ secrets.LLM_MODEL_REVIEW }}
          # 'bearer' when LLM_API_KEY is an OAuth token rather than an API key.
          LLM_AUTH:     ${{ secrets.LLM_AUTH }}
          TRANSCRIBE_API_KEY:  ${{ secrets.TRANSCRIBE_API_KEY }}
          TRANSCRIBE_BASE_URL: ${{ secrets.TRANSCRIBE_BASE_URL }}
          TRANSCRIBE_MODEL:    ${{ secrets.TRANSCRIBE_MODEL }}
          MAX_NEW:       ${{ github.event.inputs.limit || '12' }}
          # Episodes are independent; 3 in flight keeps the run inside the job
          # timeout without leaning on the model provider's rate limit.
          JOBS: "3"
          LOOKBACK_DAYS: ${{ github.event.inputs.days  || '21' }}
        run: |
          set -o pipefail
          ONLY=""
          if [ -n "${{ github.event.inputs.only }}" ]; then ONLY="--only ${{ github.event.inputs.only }}"; fi
          # The log is the audit trail for what the gate rejected and why.
          # 不含 youtube：GitHub 的机房 IP 会被 YouTube 判成机器人并索要 cookie，
          # 实测拿不到字幕。依赖 YouTube 的信源（几档中文播客）由本机的
          # scripts/local-daily.sh 负责，那边是住宅 IP。
          TRIAGE="${{ github.event.inputs.triage_min || '7' }}"
          REVIEW="${{ github.event.inputs.review_min || '7' }}"
          python pipeline/run.py $ONLY --tiers feed,notes,page,asr --skip-residential --no-build \
            --triage-min "$TRIAGE" --review-min "$REVIEW" \
            2>&1 | tee "${RUNNER_TEMP}/run.log"
          # 全站跑时，同一 job 内再扫一遍薄分类，避免再开 4 个 workflow 互相取消。
          if [ -z "${{ github.event.inputs.only }}" ]; then
            echo "::group::thin-cat waves"
            python pipeline/run.py --only restishistory,fallciv,throughline,empirehist,historyextra,tides,revolutions,histrome,ancients,britishhist,historyhit,stuffmissed,witness \
              --tiers feed,notes,page,asr --skip-residential --no-build --limit 8 \
              --triage-min "$TRIAGE" --review-min "$REVIEW" 2>&1 | tee -a "${RUNNER_TEMP}/run.log" || true
            python pipeline/run.py --only thinkingallowed,verybad,rationally,inourtime,tyler,phibites,pel,hopwag,philosophize,cautionary,econtalk,grayarea,mindscape,nbphilosophy \
              --tiers feed,notes,page,asr --skip-residential --no-build --limit 8 \
              --triage-min "$TRIAGE" --review-min "$REVIEW" 2>&1 | tee -a "${RUNNER_TEMP}/run.log" || true
            python pipeline/run.py --only sciencevs,naturepod,sciencepod,ologies,skeptics,huberman,tpwky,twiv \
              --tiers feed,notes,page,asr --skip-residential --no-build --limit 6 \
              --triage-min "$TRIAGE" --review-min "$REVIEW" 2>&1 | tee -a "${RUNNER_TEMP}/run.log" || true
            echo "::endgroup::"
          fi

      - name: Heartbeat
        if: always()
        run: |
          # 云端这条线跑过没有——和本机一样，必须留下痕迹。写在 Commit 之前且
          # if: always()，这样即使跑批失败，"这条线还活着"也能被看见。
          python pipeline/heartbeat.py cloud 0

      - name: Commit
        run: |
          git config user.name  "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          # state.json 是两条线唯一会真冲突的数据文件。没有这个驱动，
          # 冲突会在工作区留下标记，之后每次 git pull --rebase 都报
          # "unmerged files"，重试循环从此全撞在同一面墙上（真出过一次）。
          git config merge.podcast-state.driver 'python pipeline/mergestate.py %O %A %B'
          # Per-episode JSON files have unique names and never conflict on rebase.
          # Everything derived (index.html, p/, feed.xml, sitemap.xml) is rebuilt
          # from the merged set in step 2, so a concurrent run cannot lose posts.
          # -A over the whole tree: .gitignore already excludes .cache/, and
          # naming paths breaks on the first run when p/ does not exist yet.
          git clean -fdq p s 2>/dev/null || true
          git checkout -q -- index.html sources feed.xml sitemap.xml robots.txt 404.html \
                            search.json llms.txt llms-full.txt 2>/dev/null || true
          git add -A data
          if git diff --cached --quiet; then
            echo "nothing published this run"; exit 0
          fi
          git commit -m "digest: $(git diff --cached --name-only | grep -c 'data/episodes/') new"
          ok=0
          for i in $(seq 1 8); do
            if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
            # 驱动只防"能自动合的"。真留下未合并文件时必须先脱身，
            # 否则之后每次 pull 都报 unmerged，重试循环全撞同一面墙。
            if [ -n "$(git ls-files -u)" ]; then
              git rebase --abort 2>/dev/null || git merge --abort 2>/dev/null || true
              git checkout -- data/state.json 2>/dev/null || true
            fi
            echo "push retry $i"; sleep $(( (RANDOM % 5) + 3 ))
          done
          [ "$ok" = 1 ] || { echo "push failed"; exit 1; }

      - name: Rebuild the site from the merged set and push
        run: |
          git pull --rebase --autostash origin main || true
          python pipeline/build.py
          git add -A
          if git diff --cached --quiet; then echo "site unchanged"; exit 0; fi
          git commit -m "build: regenerate site"
          ok=0
          for i in $(seq 1 10); do
            if git push; then ok=1; break; fi
            # 生成产物冲突一律以重建为准，不做三方合并
            git fetch origin main
            # 三步都必需：--mixed 让索引对齐远端（--soft 会让下一个提交回退
            # 别人推上来的源码，真出过事）；取回远端有而本机没有的数据文件，
            # 否则 git add 会把别人刚发的内容当成删除提交上去；state.json 是索引
            # 不是真相，从磁盘重建而不是三方合并。
            git reset --mixed origin/main
            git diff --name-only --diff-filter=D -- data | while read -r f; do
              git checkout -- "$f" 2>/dev/null || true
            done
            python pipeline/run.py --reconcile || true
            python pipeline/build.py
            git add -A
            git diff --cached --quiet && { ok=1; break; }
            git commit -m "build: regenerate site"
            echo "push retry $i"; sleep $(( (RANDOM % 7) + 3 ))
          done
          [ "$ok" = 1 ] || { echo "::error::站点推送失败"; exit 1; }

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: ${{ runner.temp }}/run.log
          retention-days: 14
